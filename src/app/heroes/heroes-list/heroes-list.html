<div class="card mt-4 container">
    <div class="card-header">
        <h1>HEROES DRAGON BALL</h1>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-2">
                Filtrar por:
            </div>
            <div class="col-md-4">
                <input [(ngModel)]="listFilter" type="text" class="form-control"
                placeholder="Ingrese nombre del Heroe">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <h3>Filtro: {{listFilter}}</h3>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped" *ngIf="heroes.length > 0">
                <thead>
                    <tr>
                        <th>
                            <button (click)="showImage()" class="btn btn-primary">
                                {{muestraImage ? 'Ocultar' : 'Mostrar'}} Imagen
                            </button>
                        </th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Raza</th>
                        <th>Ki</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let heroe of heroes | heroesFilter:listFilter">
                        <td>
                            <img *ngIf="muestraImage" [src]="heroe.image"
                            [style.width.px]="imageWidth"
                            [style.margin.px]="imageMargin" />
                        </td>
                        <td>{{heroe.name}}</td>
                        <td>{{heroe.description}}</td>
                        <td>{{heroe.race}}</td>
                        <td>{{heroe.ki}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
